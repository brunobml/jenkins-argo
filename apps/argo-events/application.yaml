apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-events
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-events
    targetRevision: 2.4.24

    helm:
      releaseName: argo-events
      values: |
        controller:
          replicas: 1

          metrics:
            enabled: true
            serviceMonitor:
              enabled: false

        webhook:
          enabled: true
          replicas: 1

        extraObjects:
          - apiVersion: argoproj.io/v1alpha1
            kind: EventBus
            metadata:
              name: default
              namespace: argo-events
              annotations:
                argocd.argoproj.io/sync-wave: "1"
            spec:
              jetstream:
                version: latest

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-events

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true