apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.11.0

    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: daemonset

        alloy:
          # tail the on-disk pod logs (/var/log/pods) instead of the k8s API
          mounts:
            varlog: true

          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          configMap:
            create: true
            content: |-
              discovery.kubernetes "pods" {
                role = "pod"

                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("NODE_NAME"), constants.hostname)
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }

                rule {
                  source_labels = [
                    "__meta_kubernetes_namespace",
                    "__meta_kubernetes_pod_container_name",
                  ]
                  separator    = "/"
                  target_label = "job"
                }

                // Argo Workflows: keep the workflow / template as Loki labels so
                // a dashboard can show one workflow's logs at a time.
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_workflows_argoproj_io_workflow"]
                  target_label  = "workflow"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_workflows_argoproj_io_workflow_template"]
                  target_label  = "workflow_template"
                }

                // /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  action        = "replace"
                  replacement   = "/var/log/pods/*$1/*.log"
                  target_label  = "__path__"
                }
              }

              local.file_match "pod_logs" {
                path_targets = discovery.relabel.pod_logs.output
              }

              loki.source.file "pod_logs" {
                targets       = local.file_match.pod_logs.targets
                forward_to    = [loki.process.pod_logs.receiver]
                tail_from_end = false
              }

              loki.process "pod_logs" {
                // kubelet writes CRI-format lines: "<ts> stdout F <message>"
                stage.cri {}

                stage.static_labels {
                  values = {
                    cluster = "kind-lab",
                  }
                }

                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push"
                }
              }

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        serviceMonitor:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: alloy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
