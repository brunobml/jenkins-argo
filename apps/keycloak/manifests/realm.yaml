apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
data:
  platform-realm.json: |
    {
      "realm": "platform",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "accessTokenLifespan": 900,
      "groups": [
        { "name": "platform-admins" },
        { "name": "platform-viewers" }
      ],
      "roles": {
        "realm": [
          { "name": "platform-admin", "description": "Platform administrator" }
        ]
      },
      "users": [
        {
          "username": "developer",
          "enabled": true,
          "emailVerified": true,
          "email": "developer@platform.localhost",
          "firstName": "Dev",
          "lastName": "Eloper",
          "credentials": [ { "type": "password", "value": "developer", "temporary": false } ],
          "groups": [ "/platform-admins" ],
          "realmRoles": [ "platform-admin" ]
        },
        {
          "username": "viewer",
          "enabled": true,
          "emailVerified": true,
          "email": "viewer@platform.localhost",
          "firstName": "View",
          "lastName": "Only",
          "credentials": [ { "type": "password", "value": "viewer", "temporary": false } ],
          "groups": [ "/platform-viewers" ]
        }
      ],
      "clientScopes": [
        {
          "name": "groups",
          "description": "OpenID Connect scope that adds a groups claim to the token",
          "protocol": "openid-connect",
          "attributes": { "include.in.token.scope": "true", "display.on.consent.screen": "false" },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "argocd",
          "name": "Argo CD",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "argocd-oidc-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://argocd.localhost/auth/callback",
            "http://localhost:8085/auth/callback"
          ],
          "webOrigins": [ "+" ],
          "defaultClientScopes": [ "profile", "email", "roles", "web-origins", "groups" ]
        },
        {
          "clientId": "grafana",
          "name": "Grafana",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "grafana-oidc-secret",
          "standardFlowEnabled": true,
          "redirectUris": [ "http://grafana.localhost/login/generic_oauth" ],
          "webOrigins": [ "+" ],
          "defaultClientScopes": [ "profile", "email", "roles", "web-origins", "groups" ]
        },
        {
          "clientId": "argo-workflows",
          "name": "Argo Workflows",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "argo-workflows-oidc-secret",
          "standardFlowEnabled": true,
          "redirectUris": [ "http://workflows.localhost/oauth2/callback" ],
          "webOrigins": [ "+" ],
          "defaultClientScopes": [ "profile", "email", "roles", "web-origins", "groups" ]
        },
        {
          "clientId": "jenkins",
          "name": "Jenkins",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "jenkins-oidc-secret",
          "standardFlowEnabled": true,
          "redirectUris": [ "http://jenkins.localhost/securityRealm/finishLogin" ],
          "webOrigins": [ "+" ],
          "defaultClientScopes": [ "profile", "email", "roles", "web-origins", "groups" ]
        }
      ]
    }
