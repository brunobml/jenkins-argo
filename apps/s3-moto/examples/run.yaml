# A one-off run of the s3-moto-terraform WorkflowTemplate.
#   kubectl -n argo-workflows create -f apps/s3-moto/examples/run.yaml
# (use `create`, not `apply` - generateName needs a fresh name each run)
#
# mode: deploy (default) = terraform apply ; mode: teardown = terraform destroy
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: s3-moto-
  namespace: argo-workflows
spec:
  workflowTemplateRef:
    name: s3-moto-terraform
  arguments:
    parameters:
      - name: mode
        value: deploy
