# Infra pipeline for the s3-moto app. Two modes:
#   mode=deploy   (default) : terraform apply  -> bucket exists, then verify
#   mode=teardown           : terraform destroy -> bucket removed
#
# Argo CD drives this automatically (see provision-workflow.yaml / teardown-
# workflow.yaml). You can also run it by hand:
#   argo submit -n argo-workflows --from workflowtemplate/s3-moto-terraform --watch
#   argo submit -n argo-workflows --from workflowtemplate/s3-moto-terraform -p mode=teardown --watch
#
# Lives in the argo-workflows namespace because the controller is installed with
# singleNamespace=true (it only watches argo-workflows).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: s3-moto-terraform
  namespace: argo-workflows
  annotations:
    # PreSync hook (wave -1): (re)applied on every sync so the pipeline
    # definition is never stale, then the provisioning Workflow (wave 0) runs it.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  serviceAccountName: argo-workflow
  entrypoint: main

  arguments:
    parameters:
      - name: bucket_name
        value: s3-consumer-demo
      - name: git_revision
        value: main
      # host.k3d.internal:5000 = Moto on the k3d host. Set to "" for real AWS.
      - name: s3_endpoint
        value: http://host.k3d.internal:5000
      - name: mode
        value: deploy

  podGC:
    strategy: OnWorkflowSuccess

  # Ephemeral scratch space shared by the steps; deleted when the workflow ends.
  volumeClaimTemplates:
    - metadata:
        name: workdir
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi

  templates:
    - name: main
      steps:
        - - name: checkout
            template: checkout
        - - name: apply
            template: terraform
            when: "{{workflow.parameters.mode}} == deploy"
            arguments:
              parameters:
                - name: action
                  value: apply
        - - name: verify
            template: verify
            when: "{{workflow.parameters.mode}} == deploy"
        - - name: publish-config
            template: publish-config
            when: "{{workflow.parameters.mode}} == deploy"
        - - name: destroy
            template: terraform
            when: "{{workflow.parameters.mode}} == teardown"
            arguments:
              parameters:
                - name: action
                  value: destroy

    # 1. Pull this repo onto the shared volume.
    - name: checkout
      inputs:
        artifacts:
          - name: repo
            path: /work/src
            git:
              repo: https://github.com/brunobml/jenkins-argo.git
              revision: "{{workflow.parameters.git_revision}}"
              depth: 1
      container:
        image: alpine:3.22
        command: [sh, -c]
        args: ["ls -la /work/src/apps/s3-moto/terraform"]
        volumeMounts:
          - name: workdir
            mountPath: /work

    # 2/4. terraform init + (apply | destroy) in apps/s3-moto/terraform.
    - name: terraform
      inputs:
        parameters:
          - name: action
      container:
        image: hashicorp/terraform:1.9.8
        command: [sh, -ceu]
        args:
          - |
            cd /work/src/apps/s3-moto/terraform
            terraform init -input=false -no-color
            case "{{inputs.parameters.action}}" in
              apply)
                # State is per-run (ephemeral volume), so adopt the bucket if it
                # already exists in Moto before planning - keeps re-runs idempotent.
                terraform import -input=false -no-color aws_s3_bucket.app "$TF_VAR_bucket_name" 2>/dev/null || true
                terraform plan  -input=false -no-color
                terraform apply -input=false -auto-approve -no-color
                echo "--- outputs ---"
                terraform output -no-color
                # hand the real outputs to the next step via the shared volume
                terraform output -raw bucket_name > /work/tf.bucket
                ;;
              destroy)
                terraform import -input=false -no-color aws_s3_bucket.app "$TF_VAR_bucket_name" 2>/dev/null || true
                # import brings force_destroy back as false; apply writes it to
                # true in state so destroy will empty the bucket first.
                terraform apply   -input=false -auto-approve -no-color
                terraform destroy -input=false -auto-approve -no-color
                ;;
            esac
        workingDir: /work/src/apps/s3-moto/terraform
        env:
          - name: AWS_ACCESS_KEY_ID
            value: "test"
          - name: AWS_SECRET_ACCESS_KEY
            value: "test"
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"
          - name: TF_VAR_bucket_name
            value: "{{workflow.parameters.bucket_name}}"
          - name: TF_VAR_s3_endpoint
            value: "{{workflow.parameters.s3_endpoint}}"
          - name: TF_IN_AUTOMATION
            value: "1"
        volumeMounts:
          - name: workdir
            mountPath: /work

    # 3. Prove the bucket really exists, independently of Terraform state.
    - name: verify
      container:
        image: amazon/aws-cli:2.17.20
        command: [sh, -ceu]
        args:
          - |
            echo "== Buckets =="
            aws s3 ls
            echo
            echo "== Objects in {{workflow.parameters.bucket_name}} =="
            aws s3 ls "s3://{{workflow.parameters.bucket_name}}" --recursive
        env:
          - name: AWS_ACCESS_KEY_ID
            value: "test"
          - name: AWS_SECRET_ACCESS_KEY
            value: "test"
          - name: AWS_DEFAULT_REGION
            value: "us-east-1"
          - name: AWS_ENDPOINT_URL
            value: "{{workflow.parameters.s3_endpoint}}"

    # 4. Publish the provisioned infra's coordinates as a Secret the app consumes.
    #    This is the "infra output -> app config" handoff.
    - name: publish-config
      container:
        image: alpine/k8s:1.31.1
        command: [sh, -ceu]
        args:
          - |
            BUCKET="$(cat /work/tf.bucket)"
            echo "publishing s3-moto-infra Secret (bucket=$BUCKET)"
            kubectl create secret generic s3-moto-infra -n s3-moto \
              --from-literal=BUCKET_NAME="$BUCKET" \
              --from-literal=AWS_ENDPOINT_URL="{{workflow.parameters.s3_endpoint}}" \
              --from-literal=AWS_DEFAULT_REGION=us-east-1 \
              --dry-run=client -o yaml | kubectl apply -f -
        volumeMounts:
          - name: workdir
            mountPath: /work
