# PostSync hook: runs on every Argo CD sync, AFTER the bucket (wave 1) and the
# artifact ConfigMap (wave 2) are in place. Pushes the current artifact to S3.
#
# BeforeHookCreation delete policy => the previous job is removed and a fresh one
# created each sync, so you always see the latest upload. Upload is idempotent
# (aws s3 cp overwrites), so re-running on unrelated syncs is harmless.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-moto-deploy
  namespace: s3-moto
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: deploy
          image: amazon/aws-cli:2.17.20
          command: [sh, -ceu]
          args:
            - |
              echo "uploading artifact -> s3://$BUCKET_NAME/index.html"
              aws s3 cp /artifact/index.html "s3://$BUCKET_NAME/index.html" --content-type text/html
              echo
              echo "bucket now contains:"
              aws s3 ls "s3://$BUCKET_NAME/" --recursive
          envFrom:
            - configMapRef:
                name: s3-consumer-config
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          volumeMounts:
            - name: artifact
              mountPath: /artifact
      volumes:
        - name: artifact
          configMap:
            name: s3-moto-artifact
