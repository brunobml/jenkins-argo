# PreSync hook (wave 0): runs the infra pipeline before the app is deployed.
#
# Lives in argo-workflows (not the app's namespace), so `kubectl delete namespace
# s3-moto` doesn't touch it and there's no hook-finalizer to deadlock the delete.
#
# BeforeHookCreation => Argo CD deletes the previous Workflow and creates a fresh
# one, so it never runs a stale template. It BLOCKS the sync until Succeeded, so
# the bucket exists before the app rolls. The app doesn't hard-depend on this
# though (it reads bucket config from a Git ConfigMap and shows a 503 page if the
# bucket is missing), so a skipped run just means a brief "infra not ready".
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: s3-moto-provision
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  workflowTemplateRef:
    name: s3-moto-terraform
  arguments:
    parameters:
      - name: mode
        value: deploy
