# PreSync hook (wave 0): runs the infra pipeline on EVERY Argo CD sync.
#
# hook-delete-policy:
#   BeforeHookCreation - delete the previous Workflow before creating a new one
#   HookSucceeded      - delete it again once it succeeds
# Net effect: no Workflow object lingers, so Argo CD always creates + runs a
# fresh one each sync (even when nothing in Git changed - e.g. after someone
# deletes the s3-moto namespace). Argo CD BLOCKS the rest of the sync until it
# reports Succeeded, guaranteeing "bucket provisioned + s3-moto-infra Secret
# written" before the app Deployment is applied.
#
# terraform apply is idempotent (import -> plan -> apply), so re-running it on
# every sync just reconciles the infra. Cost: ~90s per sync, mostly the AWS
# provider download in `terraform init`.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: s3-moto-provision
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  workflowTemplateRef:
    name: s3-moto-terraform
  arguments:
    parameters:
      - name: mode
        value: deploy
