# PreSync hook (wave 0): runs the infra pipeline on every Argo CD sync.
#
# BeforeHookCreation => Argo CD deletes the old Workflow and creates a fresh one
# each sync (so it never runs a stale template), and BLOCKS the rest of the sync
# until it reports Succeeded - that is what guarantees "bucket provisioned +
# s3-moto-infra Secret written" before the app Deployment is applied.
#
# terraform apply is idempotent (import -> plan -> apply), so re-running it on
# every sync just reconciles the infra.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: s3-moto-provision
  namespace: argo-workflows
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "0"
spec:
  workflowTemplateRef:
    name: s3-moto-terraform
  arguments:
    parameters:
      - name: mode
        value: deploy
