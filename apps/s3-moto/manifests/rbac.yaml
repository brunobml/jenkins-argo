# PreSync hook (wave -2): lets the Argo Workflows service account write the
# s3-moto-infra Secret into the s3-moto namespace. Applied before the
# provisioning workflow runs (wave 0). No delete policy => it persists.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-moto-infra-writer
  namespace: s3-moto
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-moto-infra-writer
  namespace: s3-moto
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: s3-moto-infra-writer
subjects:
  - kind: ServiceAccount
    name: argo-workflow
    namespace: argo-workflows
