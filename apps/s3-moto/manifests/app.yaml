# The s3-moto guestbook: a real HTTP service whose datastore is the S3 bucket.
#
# Config (bucket name, endpoint) is a plain Git-managed ConfigMap - Argo CD
# recreates it directly, so `kubectl delete namespace s3-moto` heals with no
# manual steps. The provisioning workflow (PreSync) makes sure the bucket
# exists; if it doesn't, the app serves a 503 "infra not ready" page rather
# than crash-looping.
#
# The image is built by the s3-moto-build workflow (kaniko) and kept current by
# Argo CD Image Updater (see image-updater.yaml). The tag here is just the seed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-moto-app
  namespace: s3-moto
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-moto-config
  namespace: s3-moto
data:
  # must match terraform/variables.tf (var.bucket_name) and the workflow's
  # bucket_name parameter
  BUCKET_NAME: s3-consumer-demo
  AWS_ENDPOINT_URL: http://host.k3d.internal:5000
  AWS_DEFAULT_REGION: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-moto-app
  namespace: s3-moto
  labels:
    app: s3-moto-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-moto-app
  template:
    metadata:
      labels:
        app: s3-moto-app
    spec:
      serviceAccountName: s3-moto-app
      containers:
        - name: app
          image: k3d-registry:5000/s3-moto-app:85b6c8a
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: s3-moto-config
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: s3-moto-app
  namespace: s3-moto
spec:
  selector:
    app: s3-moto-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-moto-app
  namespace: s3-moto
spec:
  ingressClassName: traefik
  rules:
    - host: s3-moto.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-moto-app
                port:
                  number: 80
