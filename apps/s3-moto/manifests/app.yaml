# The "app that runs on AWS": it reads its release artifact (index.html) from
# the S3 bucket every 15s and prints it. Watch its logs after editing
# artifact.yaml + pushing - the new content shows up once Argo CD syncs and the
# PostSync job re-uploads.
#
# Only lab-specific bits: AWS_ENDPOINT_URL (point the SDK at Moto) + dummy creds.
# For real AWS: drop both, give the ServiceAccount an IAM role (IRSA/Pod Identity).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-consumer
  namespace: s3-moto
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s3-consumer-config
  namespace: s3-moto
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  AWS_DEFAULT_REGION: us-east-1
  # Moto on the k3d host. Remove this key to talk to real AWS S3.
  AWS_ENDPOINT_URL: http://host.k3d.internal:5000
  BUCKET_NAME: s3-consumer-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-consumer
  namespace: s3-moto
  labels:
    app: s3-consumer
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-consumer
  template:
    metadata:
      labels:
        app: s3-consumer
    spec:
      serviceAccountName: s3-consumer
      containers:
        - name: app
          image: amazon/aws-cli:2.17.20
          command: [sh, -ceu]
          args:
            - |
              echo "s3-consumer: reading s3://$BUCKET_NAME/index.html every 15s"
              while true; do
                ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                if aws s3 cp "s3://$BUCKET_NAME/index.html" - 2>/tmp/err; then
                  echo "--- [$ts] current release ---"
                else
                  echo "[$ts] artifact not available yet - waiting for Argo CD to deploy it"
                  sed 's/^/    /' /tmp/err
                fi
                sleep 15
              done
          envFrom:
            - configMapRef:
                name: s3-consumer-config
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
