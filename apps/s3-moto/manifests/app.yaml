# The s3-moto guestbook: a real HTTP service whose datastore is the S3 bucket.
#
# It reads its config from the s3-moto-infra Secret, which the provisioning
# workflow writes from `terraform output`. No Secret -> the Deployment cannot
# start -> the Argo CD app is not Healthy. That is the real infra->app dependency.
#
# The image is built by the s3-moto-build workflow (kaniko) and kept current by
# Argo CD Image Updater (see application.yaml annotations). The tag here is just
# the seed - Image Updater rewrites it via the kustomize images override.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-moto-app
  namespace: s3-moto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-moto-app
  namespace: s3-moto
  labels:
    app: s3-moto-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-moto-app
  template:
    metadata:
      labels:
        app: s3-moto-app
    spec:
      serviceAccountName: s3-moto-app
      containers:
        - name: app
          image: k3d-registry:5000/s3-moto-app:85b6c8a
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # bucket name + endpoint + region, written by the provisioning workflow
            - secretRef:
                name: s3-moto-infra
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: s3-moto-app
  namespace: s3-moto
spec:
  selector:
    app: s3-moto-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-moto-app
  namespace: s3-moto
spec:
  ingressClassName: traefik
  rules:
    - host: s3-moto.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-moto-app
                port:
                  number: 80
