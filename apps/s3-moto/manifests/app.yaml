# The s3-moto guestbook: a real HTTP service whose datastore is the S3 bucket.
#
# It reads its config from the s3-moto-infra Secret, which the provisioning
# workflow writes from `terraform output`. No Secret -> the Deployment cannot
# start -> the Argo CD app is not Healthy. That is the real infra->app dependency.
#
# Phase A runs the code from a ConfigMap (kustomize configMapGenerator over
# app/main.py). Phase B replaces the ConfigMap with a container image built
# by the CI workflow.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-moto-app
  namespace: s3-moto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-moto-app
  namespace: s3-moto
  labels:
    app: s3-moto-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-moto-app
  template:
    metadata:
      labels:
        app: s3-moto-app
    spec:
      serviceAccountName: s3-moto-app
      containers:
        - name: app
          image: python:3.12-slim
          command: [sh, -ceu]
          args:
            - |
              pip install --quiet --root-user-action=ignore boto3
              exec python /app/main.py
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # bucket name + endpoint + region, written by the provisioning workflow
            - secretRef:
                name: s3-moto-infra
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          volumeMounts:
            - name: code
              mountPath: /app
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 40
            periodSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              memory: 192Mi
      volumes:
        - name: code
          configMap:
            name: s3-moto-app-code
---
apiVersion: v1
kind: Service
metadata:
  name: s3-moto-app
  namespace: s3-moto
spec:
  selector:
    app: s3-moto-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-moto-app
  namespace: s3-moto
spec:
  ingressClassName: traefik
  rules:
    - host: s3-moto.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3-moto-app
                port:
                  number: 80
