apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s3-moto
  namespace: argocd
  annotations:
    # Argo CD Image Updater: watch the CI-built image, deploy newer git-sha tags.
    argocd-image-updater.argoproj.io/image-list: app=k3d-registry:5000/s3-moto-app
    argocd-image-updater.argoproj.io/app.update-strategy: newest-build
    argocd-image-updater.argoproj.io/app.allow-tags: regexp:^[0-9a-f]{7,40}$
    argocd-image-updater.argoproj.io/app.kustomize.image-name: k3d-registry:5000/s3-moto-app
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/brunobml/jenkins-argo.git
    targetRevision: main
    path: apps/s3-moto

  destination:
    server: https://kubernetes.default.svc
    namespace: s3-moto

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
