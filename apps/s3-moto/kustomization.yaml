apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - manifests/rbac.yaml
  - manifests/workflowtemplate.yaml
  - manifests/provision-workflow.yaml
  - manifests/teardown-workflow.yaml
  - manifests/ci-build-template.yaml
  - manifests/ci-events.yaml
  - manifests/image-updater.yaml
  - manifests/app.yaml

# Seed tag. Argo CD Image Updater (write-back method "argocd") overrides this by
# setting spec.source.kustomize.images on the s3-moto Application as new images
# land in the registry; that override wins at render time.
images:
  - name: k3d-registry:5000/s3-moto-app
    newTag: 85b6c8a
