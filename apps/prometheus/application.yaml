apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default

  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/prometheus
    targetRevision: 29.21.0
    path: .
    helm:
      releaseName: prometheus
      valuesObject:
        server:
          service:
            type: ClusterIP

          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - prometheus.localhost
            path: /
            pathType: Prefix

          persistentVolume:
            enabled: true
            storageClass: local-path
            size: 8Gi

        alertmanager:
          enabled: true

          persistence:
            enabled: true
            storageClass: local-path
            size: 2Gi

          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: alertmanager.localhost
                paths:
                  - path: /
                    pathType: Prefix

        serverFiles:
          alerting_rules.yml:
            groups:
              - name: gitops-lab
                rules:
                  - alert: GitOpsLabTestAlert
                    expr: vector(1)
                    for: 1m
                    labels:
                      severity: warning
                    annotations:
                      summary: GitOps lab test alert
                      description: Alertmanager and Prometheus alerting are working.

                  - alert: KubernetesPodStuckPending
                    expr: sum by (namespace, pod) (kube_pod_status_phase{phase="Pending"} == 1) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is pending"
                      description: "The pod has remained pending for more than 5 minutes."
                  
                  - alert: KubernetesContainerRestarting
                    expr: increase(kube_pod_container_status_restarts_total[10m]) > 3
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Container restarting in {{ $labels.namespace }}/{{ $labels.pod }}"
                      description: "The container restarted more than three times in 10 minutes."
                  
                  - alert: KubernetesNodeNotReady
                    expr: kube_node_status_condition{condition="Ready",status="true"} == 0
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Node {{ $labels.node }} is not ready"
                      description: "The Kubernetes node has not been ready for five minutes."

  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true