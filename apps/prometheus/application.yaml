apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default

  source:
    repoURL: oci://ghcr.io/prometheus-community/charts/prometheus
    targetRevision: 29.21.0
    path: .
    helm:
      releaseName: prometheus
      valuesObject:
        server:
          service:
            type: ClusterIP

          ingress:
            enabled: true
            ingressClassName: traefik
            hosts:
              - prometheus.localhost
            path: /
            pathType: Prefix

          persistentVolume:
            enabled: true
            storageClass: local-path
            size: 8Gi

        alertmanager:
          enabled: true

          persistence:
            enabled: true
            storageClass: local-path
            size: 2Gi

          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: alertmanager.localhost
                paths:
                  - path: /
                    pathType: Prefix

        serverFiles:
          alerting_rules.yml:
            groups:
              - name: gitops-lab
                rules:
                  - alert: GitOpsLabTestAlert
                    expr: vector(1)
                    for: 1m
                    labels:
                      severity: warning
                    annotations:
                      summary: GitOps lab test alert
                      description: Alertmanager and Prometheus alerting are working.

  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true