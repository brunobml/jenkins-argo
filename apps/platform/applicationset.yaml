# Platform apps - git files generator (roadmap A5).
#
# Replaces the old app-of-apps `directory` root (bootstrap/root-application.yaml
# used to recurse apps/ and apply every */application.yaml). Now: one flat
# params file per app under apps/platform/params/, and this ApplicationSet
# renders the Argo CD Application from it.
#
# The `template` block carries only what every app shares. `templatePatch`
# builds the per-app source/sources, finalizers and syncOptions - it runs as a
# Go template producing a JSON merge patch, which is the escape hatch for the
# structural variants (helm repo vs OCI vs plain manifests vs multi-source).
#
# params schema (apps/platform/params/<name>.yaml):
#   name, namespace            - required
#   type: helm | oci | dir     - single-source apps
#   repoURL, revision          - single-source apps
#   chart                      - type helm
#   path                       - type dir
#   directoryInclude           - type dir, `source.directory.include`
#   values: {...}              - helm valuesObject (helm/oci)
#   sources: [...]             - multi-source apps (verbatim Argo source list)
#   finalizer: true            - add resources-finalizer.argocd.argoproj.io
#   syncOptions: [...]         - defaults handled per-file ([] = none)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true

  # Argo CD Image Updater (write-back method "argocd") sets a kustomize image
  # override on the generated s3-moto Application - let it, don't revert it.
  ignoreApplicationDifferences:
    - name: s3-moto
      jsonPointers:
        - /spec/source/kustomize/images

  generators:
    - git:
        repoURL: https://github.com/brunobml/jenkins-argo.git
        revision: main
        files:
          - path: apps/platform/params/*.yaml

  template:
    metadata:
      name: '{{ .name }}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

  templatePatch: |
    {{- $src := dict "repoURL" .repoURL "targetRevision" (.revision | toString) -}}
    {{- if eq .type "helm" }}{{- $_ := set $src "chart" .chart }}{{- end -}}
    {{- if eq .type "oci" }}{{- $_ := set $src "path" "." }}{{- end -}}
    {{- if eq .type "dir" }}{{- $_ := set $src "path" .path }}{{- end -}}
    {{- if .directoryInclude }}{{- $_ := set $src "directory" (dict "include" .directoryInclude) }}{{- end -}}
    {{- if .values }}{{- $_ := set $src "helm" (dict "releaseName" .name "valuesObject" .values) }}{{- end -}}
    {{- $spec := dict -}}
    {{- if .sources }}{{- $_ := set $spec "sources" .sources }}{{- else }}{{- $_ := set $spec "source" $src }}{{- end -}}
    {{- if .syncOptions }}{{- $_ := set $spec "syncPolicy" (dict "syncOptions" .syncOptions) }}{{- end -}}
    {{- $patch := dict "spec" $spec -}}
    {{- if .finalizer }}{{- $_ := set $patch "metadata" (dict "finalizers" (list "resources-finalizer.argocd.argoproj.io")) }}{{- end -}}
    {{ $patch | toRawJson }}
