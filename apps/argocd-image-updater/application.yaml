apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.2.4

    helm:
      releaseName: argocd-image-updater
      valuesObject:
        config:
          # talk to the local Argo CD API in the same cluster
          argocd:
            grpcWeb: true
            serverAddress: argocd-server.argocd.svc.cluster.local
            insecure: true
            plaintext: true

          # the in-cluster HTTP registry that the CI workflow pushes to
          registries:
            - name: k3d-registry
              prefix: k3d-registry:5000
              api_url: http://k3d-registry:5000
              insecure: true
              default: true

          logLevel: info

        # poll every 2 min (default) is fine; keep one replica
        replicaCount: 1
