apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow-trigger-sa
  namespace: argo-events

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-trigger
  namespace: argo-workflows
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - workflows
    verbs:
      - create
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-trigger
  namespace: argo-workflows
subjects:
  - kind: ServiceAccount
    name: workflow-trigger-sa
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-trigger