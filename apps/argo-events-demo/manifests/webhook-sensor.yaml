apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: lab-webhook
  namespace: argo-events
spec:
  template:
    serviceAccountName: workflow-trigger-sa

  dependencies:
    - name: deploy-request
      eventSourceName: lab-webhook
      eventName: deploy

  triggers:
    - template:
        name: submit-lab-workflow

        argoWorkflow:
          operation: submit

          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow

              metadata:
                generateName: event-webhook-
                namespace: argo-workflows

              spec:
                serviceAccountName: argo-workflow

                entrypoint: print-message

                arguments:
                  parameters:
                    - name: message
                      value: Default message

                templates:
                  - name: print-message
                    inputs:
                      parameters:
                        - name: message

                    container:
                      image: alpine:3.22
                      command:
                        - /bin/sh
                        - -c
                      args:
                        - |
                          echo "================================="
                          echo "Workflow triggered by Argo Events"
                          echo "Message: {{inputs.parameters.message}}"
                          echo "================================="

          parameters:
            - src:
                dependencyName: deploy-request
                dataKey: body.message
              dest: spec.arguments.parameters.0.value