apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd
spec:
  project: default

  source:
    repoURL: oci://ghcr.io/jenkinsci/helm-charts/jenkins
    targetRevision: 5.9.49
    path: .
    helm:
      releaseName: jenkins
      valuesObject:
        controller:
          serviceType: ClusterIP
          ingress:
            enabled: true
            ingressClassName: traefik
            hostName: jenkins.localhost

          jenkinsUrl: http://jenkins.localhost

          additionalPlugins:
            - oic-auth

          JCasC:
            securityRealm: |-
              oic:
                clientId: "jenkins"
                clientSecret: "jenkins-oidc-secret"
                serverConfiguration:
                  wellKnown:
                    wellKnownOpenIDConfigurationUrl: "http://keycloak.localhost/realms/platform/.well-known/openid-configuration"
                    scopesOverride: "openid email profile groups"
                userNameField: "preferred_username"
                fullNameFieldName: "name"
                emailFieldName: "email"
                groupsFieldName: "groups"
                disableSslVerification: true
                logoutFromOpenidProvider: true
            authorizationStrategy: |-
              loggedInUsersCanDoAnything:
                allowAnonymousRead: false

        persistence:
          enabled: true
          storageClass: local-path
          size: 8Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
