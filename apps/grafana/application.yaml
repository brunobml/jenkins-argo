apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: default

  source:
    repoURL: oci://ghcr.io/grafana/helm-charts/grafana
    targetRevision: 10.1.4
    path: .
    helm:
      releaseName: grafana
      valuesObject:
        # The client secret is intentionally inlined (lab-only fixed secret),
        # so opt out of the chart's leaked-secret assertion.
        assertNoLeakedSecrets: false

        service:
          type: ClusterIP

        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            - grafana.localhost

        grafana.ini:
          server:
            root_url: http://grafana.localhost
          auth:
            oauth_allow_insecure_email_lookup: true
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            client_id: grafana
            client_secret: grafana-oidc-secret
            scopes: openid profile email
            auth_url: http://keycloak.localhost/realms/platform/protocol/openid-connect/auth
            token_url: http://keycloak.localhost/realms/platform/protocol/openid-connect/token
            api_url: http://keycloak.localhost/realms/platform/protocol/openid-connect/userinfo
            login_attribute_path: preferred_username
            groups_attribute_path: groups
            role_attribute_path: "contains(groups[*], 'platform-admins') && 'GrafanaAdmin' || contains(groups[*], 'platform-viewers') && 'Viewer' || 'Viewer'"
            allow_assign_grafana_admin: true
            auto_login: false
            use_pkce: true

        persistence:
          enabled: true
          storageClassName: local-path
          size: 5Gi

        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.prometheus.svc.cluster.local
                isDefault: true
                editable: true

              - name: Loki
                type: loki
                uid: loki
                access: proxy
                url: http://loki-gateway.loki.svc.cluster.local
                isDefault: false
                editable: false

        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: Kubernetes
                type: file
                disableDeletion: true
                editable: false
                options:
                  path: /var/lib/grafana/dashboards/default

        dashboards:
          default:
            kubernetes-overview:
              json: |
                {
                  "annotations": {
                    "list": []
                  },
                  "editable": false,
                  "panels": [
                    {
                      "type": "stat",
                      "title": "Total Pods",
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "targets": [
                        {
                          "expr": "count(kube_pod_info)",
                          "instant": true,
                          "refId": "A"
                        }
                      ],
                      "gridPos": {
                        "h": 6,
                        "w": 6,
                        "x": 0,
                        "y": 0
                      }
                    },
                    {
                      "type": "stat",
                      "title": "Running Pods",
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "targets": [
                        {
                          "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
                          "instant": true,
                          "refId": "A"
                        }
                      ],
                      "gridPos": {
                        "h": 6,
                        "w": 6,
                        "x": 6,
                        "y": 0
                      }
                    },
                    {
                      "type": "stat",
                      "title": "Pending or Failed Pods",
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "targets": [
                        {
                          "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed\"})",
                          "instant": true,
                          "refId": "A"
                        }
                      ],
                      "gridPos": {
                        "h": 6,
                        "w": 6,
                        "x": 12,
                        "y": 0
                      }
                    },
                    {
                      "type": "stat",
                      "title": "Prometheus Targets Up",
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "targets": [
                        {
                          "expr": "sum(up)",
                          "instant": true,
                          "refId": "A"
                        }
                      ],
                      "gridPos": {
                        "h": 6,
                        "w": 6,
                        "x": 18,
                        "y": 0
                      }
                    },
                    {
                      "type": "bargauge",
                      "title": "Pods by Namespace",
                      "datasource": {
                        "type": "prometheus",
                        "uid": "PBFA97CFB590B2093"
                      },
                      "targets": [
                        {
                          "expr": "count(kube_pod_info) by (namespace)",
                          "instant": true,
                          "legendFormat": "{{namespace}}",
                          "refId": "A"
                        }
                      ],
                      "gridPos": {
                        "h": 9,
                        "w": 24,
                        "x": 0,
                        "y": 6
                      }
                    }
                  ],
                  "refresh": "30s",
                  "schemaVersion": 41,
                  "tags": [
                    "kubernetes",
                    "gitops"
                  ],
                  "time": {
                    "from": "now-1h",
                    "to": "now"
                  },
                  "timezone": "browser",
                  "title": "Kubernetes Overview",
                  "uid": "kubernetes-overview",
                  "version": 1
                }        

            kubernetes-logs:
              json: |
                {
                  "annotations": {
                    "list": []
                  },
                  "editable": false,
                  "panels": [
                    {
                      "datasource": {
                        "type": "loki",
                        "uid": "loki"
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "short"
                        },
                        "overrides": []
                      },
                      "gridPos": {
                        "h": 8,
                        "w": 24,
                        "x": 0,
                        "y": 0
                      },
                      "id": 1,
                      "options": {
                        "legend": {
                          "displayMode": "list",
                          "placement": "bottom",
                          "showLegend": true
                        },
                        "tooltip": {
                          "mode": "multi"
                        }
                      },
                      "targets": [
                        {
                          "expr": "sum by (namespace) (count_over_time({cluster=\"kind-lab\"}[1m]))",
                          "legendFormat": "{{namespace}}",
                          "queryType": "range",
                          "refId": "A"
                        }
                      ],
                      "title": "Log Volume by Namespace",
                      "type": "timeseries"
                    },
                    {
                      "datasource": {
                        "type": "loki",
                        "uid": "loki"
                      },
                      "gridPos": {
                        "h": 10,
                        "w": 24,
                        "x": 0,
                        "y": 8
                      },
                      "id": 2,
                      "options": {
                        "dedupStrategy": "none",
                        "enableLogDetails": true,
                        "prettifyLogMessage": false,
                        "showCommonLabels": false,
                        "showLabels": false,
                        "showTime": true,
                        "sortOrder": "Descending",
                        "wrapLogMessage": true
                      },
                      "targets": [
                        {
                          "expr": "{cluster=\"kind-lab\", namespace=~\"$namespace\", pod=~\"$pod\"} |~ \"(?i)error|warning|failed|exception\"",
                          "queryType": "range",
                          "refId": "A"
                        }
                      ],
                      "title": "Warnings and Errors",
                      "type": "logs"
                    },
                    {
                      "datasource": {
                        "type": "loki",
                        "uid": "loki"
                      },
                      "gridPos": {
                        "h": 12,
                        "w": 24,
                        "x": 0,
                        "y": 18
                      },
                      "id": 3,
                      "options": {
                        "dedupStrategy": "none",
                        "enableLogDetails": true,
                        "prettifyLogMessage": false,
                        "showCommonLabels": false,
                        "showLabels": true,
                        "showTime": true,
                        "sortOrder": "Descending",
                        "wrapLogMessage": true
                      },
                      "targets": [
                        {
                          "expr": "{cluster=\"kind-lab\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
                          "queryType": "range",
                          "refId": "A"
                        }
                      ],
                      "title": "Kubernetes Pod Logs",
                      "type": "logs"
                    }
                  ],
                  "refresh": "10s",
                  "schemaVersion": 41,
                  "tags": [
                    "kubernetes",
                    "loki",
                    "logs",
                    "gitops"
                  ],
                  "templating": {
                    "list": [
                      {
                        "allValue": ".*",
                        "current": {
                          "text": "All",
                          "value": "$__all"
                        },
                        "datasource": {
                          "type": "loki",
                          "uid": "loki"
                        },
                        "definition": "label_values({cluster=\"kind-lab\"}, namespace)",
                        "includeAll": true,
                        "label": "Namespace",
                        "name": "namespace",
                        "query": "label_values({cluster=\"kind-lab\"}, namespace)",
                        "refresh": 1,
                        "type": "query"
                      },
                      {
                        "allValue": ".*",
                        "current": {
                          "text": "All",
                          "value": "$__all"
                        },
                        "datasource": {
                          "type": "loki",
                          "uid": "loki"
                        },
                        "definition": "label_values({cluster=\"kind-lab\", namespace=~\"$namespace\"}, pod)",
                        "includeAll": true,
                        "label": "Pod",
                        "name": "pod",
                        "query": "label_values({cluster=\"kind-lab\", namespace=~\"$namespace\"}, pod)",
                        "refresh": 1,
                        "type": "query"
                      },
                      {
                        "allValue": ".*",
                        "current": {
                          "text": "All",
                          "value": "$__all"
                        },
                        "datasource": {
                          "type": "loki",
                          "uid": "loki"
                        },
                        "definition": "label_values({cluster=\"kind-lab\", namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
                        "includeAll": true,
                        "label": "Container",
                        "name": "container",
                        "query": "label_values({cluster=\"kind-lab\", namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
                        "refresh": 1,
                        "type": "query"
                      }
                    ]
                  },
                  "time": {
                    "from": "now-1h",
                    "to": "now"
                  },
                  "timezone": "browser",
                  "title": "Kubernetes Logs",
                  "uid": "kubernetes-logs",
                  "version": 1
                }

        deploymentStrategy:
          type: Recreate
        initChownData:
          enabled: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 472
          runAsGroup: 472
          fsGroup: 472

  destination:
    server: https://kubernetes.default.svc
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true