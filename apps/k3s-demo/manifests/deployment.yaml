apiVersion: apps/v1
kind: Deployment
metadata:
  name: k3s-demo
  labels:
    app: k3s-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k3s-demo
  template:
    metadata:
      labels:
        app: k3s-demo
    spec:
      containers:
        - name: app
          image: k3d-registry:5000/k3s-demo:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /www
              echo "<h1>Hello from k3s-demo!</h1><p>Built by Bitbucket Pipelines & deployed by ArgoCD on local k3s.</p>" > /www/index.html
              exec busybox httpd -f -p 8080 -h /www
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
