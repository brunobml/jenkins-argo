# Credentials Argo Workflows uses to write artifacts + archived logs to MinIO.
# Must match the minio-root Secret in apps/minio/manifests/minio.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: argo-artifacts-minio
  namespace: argo-workflows
type: Opaque
stringData:
  accesskey: minioadmin
  secretkey: minioadmin123
