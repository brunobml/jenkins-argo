# OIDC client credentials for the Argo Workflows server SSO integration.
# The argo-workflows Helm chart only accepts the client id/secret as references
# to an existing Secret, so it is created here alongside the chart source.
# Lab-only fixed secret - matches the "argo-workflows" client in the Keycloak realm.
apiVersion: v1
kind: Secret
metadata:
  name: argo-workflows-sso
  namespace: argo-workflows
type: Opaque
stringData:
  client-id: argo-workflows
  client-secret: argo-workflows-oidc-secret
