apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflows
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-workflows
      targetRevision: 1.0.23

      helm:
        releaseName: argo-workflows
        values: |
          workflow:
            serviceAccount:
              create: true
              name: argo-workflow

            rbac:
              create: true

          # Persist step logs + artifacts to MinIO so `argo logs` and the UI
          # still work after the step pods are garbage-collected.
          artifactRepository:
            archiveLogs: true
            s3:
              endpoint: minio.minio.svc.cluster.local:9000
              bucket: argo-workflows
              insecure: true
              accessKeySecret:
                name: argo-artifacts-minio
                key: accesskey
              secretKeySecret:
                name: argo-artifacts-minio
                key: secretkey

          controller:
            workflowNamespaces:
              - argo-workflows

            # Let the Prometheus kubernetes-pods job scrape the controller metrics
            # (port 9090) - feeds the "Argo Workflows / Overview" Grafana dashboard.
            podAnnotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "9090"
              prometheus.io/path: /metrics

            # The Argo UI's archived-log fallback is unreliable in v4.0.x
            # (argoproj/argo-workflows#14885, #12948), so instead of GC-ing pods
            # early we keep them for the whole Workflow lifetime - the UI then
            # always has *live* logs. ttlStrategy deletes the Workflow (and its
            # pods) after 7 days. archiveLogs still copies to MinIO as a backup /
            # for the node "Artifacts" view; Loki+Grafana is the real log store.
            workflowDefaults:
              spec:
                archiveLogs: true
                podGC:
                  strategy: OnWorkflowDeletion
                ttlStrategy:
                  secondsAfterCompletion: 604800

            metricsConfig:
              enabled: true
              secure: false

            telemetryConfig:
              enabled: true
              secure: false

          server:
            enabled: true

            # sso for the UI; server (SA-token) so the argo CLI / CI can auth too
            authModes:
              - sso
              - server

            secure: false

            ingress:
              enabled: true
              ingressClassName: traefik
              hosts:
                - workflows.localhost
              paths:
                - /
              pathType: Prefix

            sso:
              enabled: true
              issuer: http://keycloak.localhost/realms/platform
              clientId:
                name: argo-workflows-sso
                key: client-id
              clientSecret:
                name: argo-workflows-sso
                key: client-secret
              redirectUrl: http://workflows.localhost/oauth2/callback
              scopes:
                - email
                - profile
              rbac:
                enabled: false

          singleNamespace: true

    # Provides the argo-workflows-sso Secret referenced above.
    - repoURL: https://github.com/brunobml/jenkins-argo.git
      targetRevision: main
      path: apps/argo-workflows/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: argo-workflows

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
