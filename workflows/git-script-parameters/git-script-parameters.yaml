apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: git-script-parameters-
  namespace: argo-workflows

spec:
  serviceAccountName: argo-workflow
  entrypoint: run-git-script

  arguments:
    parameters:
      - name: message
        value: "Hello from Argo Workflows"

      - name: environment
        value: development

      - name: application-name
        value: hello-app

      - name: execution-mode
        value: standard

      - name: log-level
        value: INFO

      - name: git-revision
        value: main

  templates:
    - name: run-git-script

      inputs:
        parameters:
          - name: message
          - name: environment
          - name: application-name
          - name: execution-mode
          - name: log-level
          - name: git-revision

        artifacts:
          - name: repository
            path: /workspace/repository
            git:
              repo: https://github.com/brunobml/jenkins-argo.git
              revision: "{{inputs.parameters.git-revision}}"

      container:
        image: busybox:1.36
        imagePullPolicy: IfNotPresent

        workingDir: /workspace/repository

        command:
          - /bin/sh

        args:
          - scripts/show-parameters.sh
          - "{{inputs.parameters.message}}"
          - "{{inputs.parameters.execution-mode}}"

        env:
          - name: DEPLOY_ENVIRONMENT
            value: "{{inputs.parameters.environment}}"

          - name: APPLICATION_NAME
            value: "{{inputs.parameters.application-name}}"

          - name: LOG_LEVEL
            value: "{{inputs.parameters.log-level}}"

          - name: GIT_REVISION
            value: "{{inputs.parameters.git-revision}}"

          - name: WORKFLOW_NAME
            value: "{{workflow.name}}"

          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name