# Two in-cluster DNS fixes, both surviving a host reboot (unlike the records k3d
# only injects at cluster-create time):
#
# 1. *.localhost ingress hostnames (keycloak.localhost, ...) -> the Traefik
#    service, so the OIDC issuer URL is identical from browser and from in-cluster.
# 2. host.k3d.internal -> host.docker.internal (which Docker Desktop always
#    provides). k3d drops host.k3d.internal from CoreDNS after a machine reboot,
#    which breaks anything reaching Moto on the host (s3-moto).
#
# k3s CoreDNS imports /etc/coredns/custom/*.override into its main server block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  localhost.override: |
    template IN ANY localhost {
      match ".*\.localhost\.$"
      answer "{{ .Name }} 60 IN CNAME traefik.kube-system.svc.cluster.local."
      fallthrough
    }
  hostk3d.override: |
    rewrite name exact host.k3d.internal host.docker.internal
