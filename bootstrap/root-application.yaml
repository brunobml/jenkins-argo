apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/brunobml/jenkins-argo.git
    targetRevision: main
    path: apps
    directory:
      recurse: true
      include: '*/application.yaml'

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  # Argo CD Image Updater (write-back method "argocd") sets kustomize image
  # overrides on child Applications - let it, don't fight it from the root.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jqPathExpressions:
        - .spec.source.kustomize.images

  syncPolicy:
    automated:
      prune: true
      selfHeal: true